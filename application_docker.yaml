server:
  port: 8080
spring:
  application:
    name: "creditya-auth-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  redis:
    host: "${REDIS_IP}"
    port: "${REDIS_PORT}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

r2dbc:
  host: "${MYSQL_IP}"
  port: "${MYSQL_PORT}"
  database: "${MYSQL_DB}"
  username: "${MYSQL_USER}"
  password: "${MYSQL_PASSWORD}"
jwt:
  secretKey: "${KEY_SECRET_AUTH_JWT}"
  expirationTime: 300

aux:
  redis:
    attemptsKey: "creditya:auth:attempts_"
    attemptsLimit: 5
    attemptsExpirationTime: 30000

