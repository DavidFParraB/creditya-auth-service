jwt:
  secretKey: "12345678901234567890-12345678901234567890"
  expirationTime: 300
r2dbc:
  host: "127.0.0.1"
  port: 3306
  database: "CrediYaDB"
  username: "fyroot"
  password: 1234

aux:
  redis:
    attemptsKey: "creditya:auth:attempts_"
    attemptsLimit: 5
    attemptsExpirationTime: 30000