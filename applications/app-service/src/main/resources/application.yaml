server:
  port: 8079
spring:
  application:
    name: "creditya-auth-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  redis:
    host: "192.1680.0"
    port: 6370
  data:
    redis:
      host: "127.0.0.1"
      port: 6379
      database: 0
      password: ""
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
