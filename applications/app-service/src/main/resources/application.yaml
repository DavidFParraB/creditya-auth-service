server:
  port: 8080
spring:
  application:
    name: "creditya-auth-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

jwt:
  secretKey: 12345678901234567890-12345678901234567890
  expirationTime: 3600000
r2dbc:
  host: 127.0.0.1
  port: 3306
  database: CrediYaDB
  username: fyroot
  password: 1234